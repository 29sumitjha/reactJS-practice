<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from 2e</title>
</head>
<body>

    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        
        function ProductDetails({productName, productPrice, discountPrice, imageSrc}){

            return(
                <div>

                    <img src={imageSrc} width="200"/>

                    <p>{productName}</p>

                    {discountPrice ? (
                        <>
                            <p><del>Price: ${productPrice}</del></p>
                            <p>Discount price: ${discountPrice}</p>
                        </>
                    ):(
                        <>
                            <p>Price: ${productPrice}</p>
                        </>
                    )}
                    
                    <button>Add to Cart</button>
                </div>
            );
        }

        function App(){
            return (
                <>
                    <ProductDetails 
                        imageSrc="images/cotton-socks.png"
                        productName="Cotton socks" 
                        productPrice="10.90"
                        discountPrice = "5.45"
                    />

                    <ProductDetails 
                        imageSrc="images/plain-t-shirt.png"
                        productName="Tennis balls" 
                        productPrice="6.00"
                    />

                    <ProductDetails
                        imageSrc="images/tennis-balls.png"
                        productName="Plain T-shirt" 
                        productPrice="7.99"
                    />
                </>
                
            )
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App/>);
    </script>
</body>
</html>
